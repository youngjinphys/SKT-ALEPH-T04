# Recommended: dedicate an HTTPS subdomain so the app can live at URL root.
# Merge the location block into your existing TLS-enabled server block.
server {
    listen 443 ssl http2;
    server_name t04.example.com;

    # Reuse your existing certificate directives here.

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
    }
}
